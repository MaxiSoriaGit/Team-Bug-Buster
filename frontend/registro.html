<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta - Registro</title>

    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="d-flex align-items-center py-4 vh-100">
    <main class="form-signin w-100 m-auto" style="max-width: 420px">
      <!-- Tarjeta de registro semitransparente -->
      <div class="card border-0 shadow-lg rounded-4 p-5 bg-white bg-opacity-75">
        <form>
          <div class="text-center mb-4">
            <div class="mb-3 text-success">
              <i class="bi bi-person-plus-fill fs-1"></i>
            </div>
            <h1 class="h3 mb-2 fw-bold text-dark">Crear Cuenta</h1>
            <p class="text-muted small">Completa tus datos para registrarte</p>
          </div>

          <!-- Campo de Nombre -->
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control rounded-3"
              id="registerName"
              placeholder="Tu nombre"
              required
            />
            <label for="registerName">Nombre completo</label>
          </div>

          <!-- Campo de Correo -->
          <div class="form-floating mb-3">
            <input
              type="email"
              class="form-control rounded-3"
              id="registerEmail"
              placeholder="nombre@ejemplo.com"
              required
            />
            <label for="registerEmail">Correo electrónico</label>
          </div>

          <!-- Campo de Contraseña -->
          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control rounded-3"
              id="registerPassword"
              placeholder="Contraseña"
              required
            />

            <label for="registerPassword">Contraseña</label>
            <i
              class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer"
              id="togglePassword"
              style="cursor: pointer"
            ></i>
          </div>
          <!--repetir contraseña-->
          <div
            class="form-floating mb-3 position-relative d-none"
            id="confirmContainer"
          >
            <input
              type="password"
              class="form-control rounded-3 pe-5"
              id="confirmPassword"
              placeholder="Ingresa de vuelta tu contraseña"
            />
            <label for="confirmPassword">Repetir contraseña</label>
          </div>

          <!-- Botón de Registro -->
          <button
            class="w-100 btn btn-lg btn-success rounded-3 py-2 fw-semibold shadow-sm mb-3"
            type="submit"
          >
            Registrarse
          </button>

          <!-- Enlace para volver al login -->
          <div class="text-center mt-3">
            <p class="small text-muted mb-0">
              ¿Ya tienes una cuenta?
              <a href="login.html" class="text-decoration-none fw-semibold"
                >Inicia sesión</a
              >
            </p>
          </div>
        </form>
      </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/register.js"></script>
  </body>
</html>
