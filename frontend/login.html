<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-secondary-subtle d-flex align-items-center py-4 vh-100">
    <main class="form-signin w-100 m-auto" style="max-width: 420px">
      <div
        class="card border-0 shadow-lg rounded-4 p-5 bg-white bg-opacity-75 animacion-flotante"
      >
        <form>
          <div class="text-center mb-4">
            <div class="mb-3 text-primary">
              <i class="bi bi-person-circle fs-1"></i>
            </div>
            <h1 class="h3 mb-2 fw-bold text-dark">Bienvenido</h1>
            <p class="text-muted small">Ingresa tus datos para continuar</p>
          </div>

          <!-- Campo de Correo con bordes más suaves -->
          <div class="form-floating mb-3">
            <input
              type="email"
              class="form-control rounded-3"
              id="floatingInput"
              placeholder="nombre@ejemplo.com"
              required
            />
            <label for="floatingInput">Correo electrónico</label>
          </div>

          <!-- Campo de Contraseña -->
          <div class="form-floating mb-3 position-relative">
            <input
              type="password"
              class="form-control rounded-3 pe-5"
              id="floatingPassword"
              placeholder="Contraseña"
              required
            />
            <label for="floatingPassword">Contraseña</label>
            <i
              class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer"
              id="togglePassword"
              style="cursor: pointer"
            ></i>
          </div>

          <!-- Opciones adicionales y enlace de recuperación -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" />
              <label class="form-check-label small" for="rememberMe"
                >Recuérdame</label
              >
            </div>
            <a href="#" class="small text-decoration-none"
              >¿Olvidaste tu contraseña?</a
            >
          </div>

          <!-- Botón de Envío con esquinas redondeadas -->
          <button
            class="w-100 btn btn-lg btn-primary rounded-3 py-2 fw-semibold shadow-sm"
            type="submit"
          >
            Ingresar
          </button>
          <div class="text-center mt-3">
            <p class="small text-muted mb-0">
              ¿No tienes cuenta?<a
                href="registro.html"
                class="text-decoration-none fw-semibold"
              >
                Registrate aqui</a
              >
            </p>
          </div>
        </form>
      </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Agrega esta línea dentro de tu <head> -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="./js/login.js"></script>
  </body>
</html>
